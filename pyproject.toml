[project]
name = "infomed"
version = "0.1.0"
description = "Scraper for Infomed RCM documents"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "playwright>=1.61.0",
    "pypdf>=6.16.1",
    "pytest>=9.1.1",
    "ruff>=0.16.0",
    "scikit-learn>=1.9.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
pythonpath = ["src"]

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "D"]
ignore = ["D100", "D104", "D203", "D213"]

[tool.ruff.format]
quote-style = "double"
